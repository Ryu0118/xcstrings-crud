name: Docsync Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docsync:
    name: Docsync Check
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Bootstrap dev tools (nest)
        run: |
          curl -fsSL https://raw.githubusercontent.com/mtj0928/nest/main/install.sh | bash
          echo "$HOME/.nest/bin" >> $GITHUB_PATH
          nest bootstrap nestfile.yaml

      - name: Check doc sync
        run: .nest/bin/docsync check
