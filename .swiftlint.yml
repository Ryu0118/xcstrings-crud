# SwiftLint configuration for xcstrings-crud.

included:
  - Sources
  - Tests
  - Package.swift

excluded:
  - .build
  - .swiftpm
  - .nest
  - "**/.build/**"
  - "**/.swiftpm/**"
  - "**/.nest/**"

opt_in_rules:
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - empty_collection_literal
  - enum_case_associated_values_count
  - explicit_init
  - extension_access_modifier
  - fallthrough
  - fatal_error_message
  - file_name_no_space
  - first_where
  - flatmap_over_map_reduce
  - joined_default_parameter
  - last_where
  - literal_expression_end_indentation
  - multiline_arguments
  - multiline_parameters
  - non_optional_string_data_conversion
  - operator_usage_whitespace
  - overridden_super_call
  - prefer_self_type_over_type_of_self
  - prefer_zero_over_explicit_init
  - private_action
  - prohibited_super_call
  - redundant_type_annotation
  - sorted_first_last
  - switch_case_alignment
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - unowned_variable_capture
  - vertical_parameter_alignment_on_call
  - yoda_condition

disabled_rules:
  - colon
  - comma
  - force_cast
  - force_try
  - identifier_name
  - line_length
  - modifier_order
  - opening_brace
  - prefer_self_in_static_references
  - redundant_nil_coalescing
  - trailing_comma
  - trailing_whitespace
  - type_body_length
  - vertical_whitespace
  - void_return

function_body_length:
  warning: 80
  error: 140

file_length:
  warning: 800
  error: 1400

type_name:
  min_length: 3
  max_length: 60

nesting:
  type_level: 4
  function_level: 4

cyclomatic_complexity:
  warning: 15
  error: 25

function_parameter_count:
  warning: 8
  error: 12

large_tuple:
  warning: 4
  error: 5

enum_case_associated_values_count:
  warning: 5
  error: 7

custom_rules:
  no_nonisolated_unsafe:
    regex: 'nonisolated\(unsafe\)'
    message: "nonisolated(unsafe) is prohibited. Use actor isolation or Mutex."
    severity: error
